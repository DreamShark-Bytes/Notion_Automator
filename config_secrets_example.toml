# Copy this file to config_secrets.toml (same folder as config.toml) and fill in the values.
# config_secrets.toml is gitignored. Restrict it so only you and the service can read it:
#   Linux:   chmod 600 config_secrets.toml
#   Windows: install-service.ps1 does this for you (icacls), or run it by hand (README: "Where the token goes").

# Notion integration token (Settings -> Integrations -> New integration).
token = "ntn_your_token_here"

# Used for automated tests to be able to create what it needs in a safe space to run tests (mostly end-to-end) 
# Make sure this token only has access to a testing space so no bad code accidentally messes up something important. 
sandbox_token = "ntn_your_token_here"