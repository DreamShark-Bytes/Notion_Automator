# Notion Automator Configuration
# Run: python daemon.py

# Your Notion integration token is NOT stored in this file. Put it in config_secrets.toml next to this file
# (copy config_secrets_example.toml; README: "Where the token goes").
# Deprecated fallback (the daemon logs a warning): put it here instead.
# token = "ntn_your_token_here"

# Optional: Notion API version sent with every request. Default: "2026-03-11".
# Requires Notion_API v1.4.0 or later. Older: "2025-09-03" (databases became data sources) and
# "2022-06-28" (the original version; breaks if a database gains a second data source).
# Upgrade guides: https://developers.notion.com/guides/get-started/upgrade-guide-2025-09-03
#                 https://developers.notion.com/guides/get-started/upgrade-guide-2026-03-11
# notion_version = "2026-03-11"

# Optional: the Configuration Hub, where behavior is configured in Notion instead of below
# (README: "Setting up the Configuration Hub"). If config_hub_data_source_id is not set, the daemon reads
# the config_automations.toml file next to this one (see the end of this file).
#
# Data source IDs, not database IDs: in the Notion app open the data source, three-dots (top right),
# More, Developer, Copy data source ID. Share the data source with your integration.
# The data source where config rows live (one row per config, TOML in the row's page body). The bot adds
# an inert example row if it has none of its own. A row acts only while its Status is Active; set it to
# anything else to pause it.
# config_hub_data_source_id = "your-config-data-source-id"

# Seconds a config row must stay unchanged before the bot acts on an edit, so it does not react while you are
# still typing. It sets how long the "edited, not applied" Warning waits, and (without a Config Version column)
# when an edit is applied. Default 300 (5 minutes).
# hub_settle_seconds = 300

# How many times in a row the bot recreates its config row after it is deleted (restored from the backup copy
# config_automations.toml, which the bot writes after each clean apply). After that it stops until a restart, so a
# loop that keeps deleting the row cannot create pages forever. Default 2.
# hub_max_recreations = 2

# Optional, for the live check you run by hand (tests/live_sandbox.py, never run automatically): the page that is
# dedicated to throwaway test data. Put a callout at its top that says so; the script never edits it. Its token,
# `sandbox_token`, goes in config_secrets.toml and must differ from the normal token.
# sandbox_page_id = "your-sandbox-page-id"

# Seconds between polls (applies to all databases)
poll_interval = 60

# Hour (0–23, local time) when your logical day begins. Times between midnight and this hour
# are attributed to the previous calendar day for period key, occurrence #, and quota counting.
# Also controls when the daily governance cron fires.
# Default: 3 (3am — the statistical nadir of human activity; minimizes accidental day crossovers).
day_start_hour = 3

# First day of the week. Affects period boundaries for weekly recurring tasks.
# Matches Notion's default (Sunday). Set to "Monday" for ISO/work-week convention.
# Accepts any full day name: "Sunday", "Monday", … "Saturday".
week_start = "Sunday"

# Which databases are automated, and the recurring task settings, are NOT set here. They are set in a Configuration
# Hub config row (config_hub_data_source_id above) or, without a Hub, in a file named config_automations.toml next
# to this one, written in the same format as a config row: see docs/config_row_example.toml. The old format
# (the databases and recurring_tasks tables, and non_completion_statuses) is no longer read from this file; the
# daemon stops with the converted text if it finds it (docs/upgrade_steps.md).
